# RViz visualization of the markers, rigid bodies and skeletons of a mocap system.
launch:
  - arg: {name: namespace, default: "", description: "Namespace of the mocap system topics"}
  - arg: {name: rviz, default: "true", description: "Start RViz"}
  - arg: {name: rviz_config, default: "$(find-pkg-share mocap4r2_marker_viz)/rviz/mocap4r2.rviz"}
  - node:
      pkg: mocap4r2_marker_viz
      exec: marker_viz
      namespace: $(var namespace)
      output: screen
  - node:
      if: $(var rviz)
      pkg: rviz2
      exec: rviz2
      namespace: $(var namespace)
      args: -d $(var rviz_config)
      output: screen
