# An auxiliary system (EMG, cameras...) that joins capture sessions.
launch:
  - arg: {name: params_file, default: "$(find-pkg-share mocap4r2_control)/config/auxiliar_example.yaml"}
  - arg: {name: name, default: emg_recorder}
  - node:
      pkg: mocap4r2_control
      exec: auxiliar_system
      name: $(var name)
      output: screen
      param:
        - {from: "$(var params_file)"}
