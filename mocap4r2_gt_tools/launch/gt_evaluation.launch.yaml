# Online error of the robot localization against the mocap ground truth.
launch:
  - arg: {name: estimate_parent, default: map}
  - arg: {name: estimate_child, default: base_link}
  - arg: {name: gt_parent, default: mocap}
  - arg: {name: gt_child, default: base_link_gt}
  - arg: {name: output_dir, default: ""}
  - node:
      pkg: mocap4r2_gt_tools
      exec: gt_evaluator
      output: screen
      param:
        - {name: estimate_parent, value: "$(var estimate_parent)"}
        - {name: estimate_child, value: "$(var estimate_child)"}
        - {name: gt_parent, value: "$(var gt_parent)"}
        - {name: gt_child, value: "$(var gt_child)"}
        - {name: output_dir, value: "$(var output_dir)"}
