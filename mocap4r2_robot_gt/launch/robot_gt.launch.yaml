# Ground truth of a robot from a mocap rigid body.
launch:
  - arg: {name: params_file, default: "$(find-pkg-share mocap4r2_robot_gt)/config/robot_gt.yaml"}
  - arg: {name: namespace, default: "", description: "Namespace of the mocap system topics"}
  - node:
      pkg: mocap4r2_robot_gt
      exec: robot_gt
      name: robot_gt
      namespace: $(var namespace)
      output: screen
      param:
        - {from: "$(var params_file)"}
